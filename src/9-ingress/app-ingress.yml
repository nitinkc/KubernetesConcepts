apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  annotations:
    # Tells the Ingress controller to rewrite the path if needed (e.g., stripping /api)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: my-app.local
      http:
        paths:
          # Rule 1: Route API traffic to the backend service
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: go-backend-service
                port:
                  number: 80
          # Rule 2: Route all other traffic to the frontend service
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80