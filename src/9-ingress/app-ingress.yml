apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  annotations:
    # 1. THIS IS THE MISSING PIECE: Tells Nginx to parse regular expressions
    nginx.ingress.kubernetes.io/use-regex: "true"
    # 2. Rewrites the URL path before sending it to your backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: my-app.local
      http:
        paths:
          # Rule 1: Matches /api, /api/, or /api/users and routes to backend
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: go-backend-service
                port:
                  number: 80
          # Rule 2: Matches everything else and routes to frontend
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80