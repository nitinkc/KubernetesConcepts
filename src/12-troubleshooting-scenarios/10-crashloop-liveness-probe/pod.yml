apiVersion: v1
kind: Pod
metadata:
  name: liveness-pod
  labels:
    app: liveness-demo
spec:
  containers:
    - name: nginx
      image: nginx
      livenessProbe:
        exec:
          command: ["ls", "/tmp/l"] # file never exists -> probe always fails
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3 # 3 consecutive failures -> container restarted
