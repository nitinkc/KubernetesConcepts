apiVersion: v1
kind: Pod
metadata:
  name: oom-pod
  labels:
    app: oom-demo
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"] # uses ~250Mi
      resources:
        requests:
          memory: "100Mi"
        limits:
          memory: "200Mi" # limit < actual usage -> OOMKilled
