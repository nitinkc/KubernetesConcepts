apiVersion: v1
kind: Pod
metadata:
  name: init-fail-pod
  labels:
    app: init-demo
spec:
  initContainers:
    - name: init-setup
      image: busybox
      command: ["sh", "-c", "echo 'init failed'; exit 1"] # non-zero exit -> retried forever
  containers:
    - name: nginx
      image: nginx # never reached while init container keeps failing
