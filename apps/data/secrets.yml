# DB credentials. One admin secret per Postgres (used by the containers + seed
# Job), plus one DSN secret per DOMAIN namespace (what each app reads).
# Apply AFTER dom-orders/dom-payments/dom-inventory exist (lab 03 creates them).
apiVersion: v1
kind: Secret
metadata:
  name: commerce-db-auth
  namespace: dom-data
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: acme-demo-commerce
  POSTGRES_DB: commerce
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-db-auth
  namespace: dom-data
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: acme-demo-payments
  POSTGRES_DB: payments
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: dom-orders
type: Opaque
stringData:
  # orders_rw can UPDATE inventory.items -> the shared-schema tension (see ADR)
  DATABASE_URL: postgres://orders_rw:orders-demo-pw@commerce-db.dom-data:5432/commerce?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: dom-inventory
type: Opaque
stringData:
  DATABASE_URL: postgres://inventory_rw:inventory-demo-pw@commerce-db.dom-data:5432/commerce?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: dom-payments
type: Opaque
stringData:
  DATABASE_URL: postgres://payments_rw:payments-demo-pw@payments-db.dom-data:5432/payments?sslmode=disable
